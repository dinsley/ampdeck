name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$version" != "$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

          echo "number=$version" >> "$GITHUB_OUTPUT"

      - run: npm run check

      - name: Pack Stream Deck plugin
        run: npm run pack -- --version "${{ steps.version.outputs.number }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/com.daniel-insley.amp-deck.streamDeckPlugin
          --generate-notes
          --title "Amp Deck ${{ steps.version.outputs.number }}"
          --verify-tag
