<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
		<style>
			:root { color-scheme: dark; }
			text { font-family: "Segoe UI", Inter, Arial, sans-serif; }
			.eyebrow { fill: #E7B84B; font-size: 19px; font-weight: 700; letter-spacing: 2px; }
			.heading { fill: #F5F3ED; font-size: 42px; font-weight: 700; }
			.body { fill: #B7BBC4; font-size: 22px; }
			.card-title { fill: #F5F3ED; font-size: 24px; font-weight: 700; letter-spacing: .8px; }
			.caption { fill: #B7BBC4; font-size: 17px; }
			.small { fill: #A6ABB4; font-size: 18px; }
			.puck-name { fill: #F5F3ED; font-size: 13px; font-weight: 700; letter-spacing: .7px; }
		</style>
		<rect width="1600" height="900" fill="#121317"/>
		<circle cx="1460" cy="60" r="220" fill="#F0A832" opacity=".055"/>

		<text x="80" y="90" class="eyebrow">ACTION FEEDBACK</text>
		<text x="80" y="146" class="heading">Guarded commands show exactly what is happening.</text>
		<text x="80" y="188" class="body">Review, Ship, and Archive use hold-to-confirm; all command keys target the selected thread.</text>

				<rect x="80" y="250" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="110" y="278" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="318" y="330" class="card-title">READY</text>
				<text x="318" y="370" class="small"><tspan x="318" dy="0">Press Open, or hold</tspan><tspan x="318" dy="28">a command</tspan></text>
				<rect x="580" y="250" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="610" y="278" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="818" y="330" class="card-title">HOLDING</text>
				<text x="818" y="370" class="small"><tspan x="818" dy="0">Release early to cancel</tspan></text>
				<rect x="1080" y="250" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="1110" y="278" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="1318" y="330" class="card-title">BUSY</text>
				<text x="1318" y="370" class="small"><tspan x="1318" dy="0">Command is being</tspan><tspan x="1318" dy="28">accepted</tspan></text>
				<rect x="80" y="560" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="110" y="588" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="318" y="640" class="card-title">SENT</text>
				<text x="318" y="680" class="small"><tspan x="318" dy="0">Review or Ship</tspan><tspan x="318" dy="28">was accepted</tspan></text>
				<rect x="580" y="560" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="610" y="588" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="818" y="640" class="card-title">UNAVAILABLE</text>
				<text x="818" y="680" class="small"><tspan x="818" dy="0">The action is</tspan><tspan x="818" dy="28">temporarily blocked</tspan></text>
				<rect x="1080" y="560" width="440" height="250" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<image x="1110" y="588" width="180" height="180" href="data:image/svg+xml;base64,"/>
				<text x="1318" y="640" class="card-title">ERROR</text>
				<text x="1318" y="680" class="small"><tspan x="1318" dy="0">Check the thread or</tspan><tspan x="1318" dy="28">plugin log</tspan></text>
	</svg>
