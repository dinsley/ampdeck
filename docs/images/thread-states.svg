<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
		<style>
			:root { color-scheme: dark; }
			text { font-family: "Segoe UI", Inter, Arial, sans-serif; }
			.eyebrow { fill: #E7B84B; font-size: 19px; font-weight: 700; letter-spacing: 2px; }
			.heading { fill: #F5F3ED; font-size: 42px; font-weight: 700; }
			.body { fill: #B7BBC4; font-size: 22px; }
			.card-title { fill: #F5F3ED; font-size: 24px; font-weight: 700; letter-spacing: .8px; }
			.caption { fill: #B7BBC4; font-size: 17px; }
			.small { fill: #A6ABB4; font-size: 18px; }
			.puck-name { fill: #F5F3ED; font-size: 13px; font-weight: 700; letter-spacing: .7px; }
		</style>
		<rect width="1600" height="900" fill="#121317"/>
		<circle cx="1460" cy="60" r="220" fill="#F0A832" opacity=".055"/>

		<text x="80" y="90" class="eyebrow">THREAD STATUS</text>
		<text x="80" y="146" class="heading">Know what needs attention at a glance.</text>

				<rect x="80" y="212" width="700" height="252" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<text x="108" y="258" class="card-title">IDLE</text>
				<text x="752" y="257" class="caption" text-anchor="end">Executor connected and ready</text>
				<rect x="104" y="284" width="652" height="118" rx="16" fill="#101114"/>
				<image x="110" y="293" width="640" height="80" href="data:image/svg+xml;base64,"/>
				<text x="108" y="436" class="small">Rotate to browse • press to select • long-touch to open</text>
				<rect x="820" y="212" width="700" height="252" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<text x="848" y="258" class="card-title">WORKING</text>
				<text x="1492" y="257" class="caption" text-anchor="end">Amp is planning or using tools</text>
				<rect x="844" y="284" width="652" height="118" rx="16" fill="#101114"/>
				<image x="850" y="293" width="640" height="80" href="data:image/svg+xml;base64,"/>
				<text x="848" y="436" class="small">Thread commands stay unavailable while work is active</text>
				<rect x="80" y="530" width="700" height="252" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<text x="108" y="576" class="card-title">SHIPPING</text>
				<text x="752" y="575" class="caption" text-anchor="end">Shipping workflow is active</text>
				<rect x="104" y="602" width="652" height="118" rx="16" fill="#101114"/>
				<image x="110" y="611" width="640" height="80" href="data:image/svg+xml;base64,"/>
				<text x="108" y="754" class="small">Review, Ship, and Archive stay blocked during shipping</text>
				<rect x="820" y="530" width="700" height="252" rx="28" fill="#202228" stroke="#343740" stroke-width="2"/>
				<text x="848" y="576" class="card-title">DONE</text>
				<text x="1492" y="575" class="caption" text-anchor="end">Turn complete; no executor connected</text>
				<rect x="844" y="602" width="652" height="118" rx="16" fill="#101114"/>
				<image x="850" y="611" width="640" height="80" href="data:image/svg+xml;base64,"/>
				<text x="848" y="754" class="small">Open and Archive remain available</text>
	</svg>
