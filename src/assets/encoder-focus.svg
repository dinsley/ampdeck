<svg xmlns="http://www.w3.org/2000/svg" viewBox="{{viewBox}}" font-family="Berkeley Mono V2, SFMono-Regular, Consolas, monospace">
	<rect width="800" height="100" fill="{{surfaceColor}}"/>
	<rect x="600" y="0" width="200" height="100" fill="{{accentColor}}" opacity=".035"/>
	<g transform="translate(18 6) scale(.625)" fill="none" stroke="#595959" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<path d="M18 19a5 5 0 0 1-5-5v8"/>
		<path d="M9 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5"/>
		<circle cx="13" cy="12" r="2"/><circle cx="20" cy="19" r="2"/>
	</g>
	<text x="40" y="18" fill="#595959" font-size="11" font-weight="700" letter-spacing=".25">{{project}}</text>
	<text x="582" y="18" text-anchor="end" fill="{{mutedTextColor}}" font-size="10" font-weight="700">{{position}}</text>
	{{titleMarkup}}
	{{executorGlyph}}
	<text x="40" y="84" fill="{{executorTextColor}}" font-size="11" font-weight="700">{{executorLabel}}</text>
	<text x="407" y="84" fill="{{mutedTextColor}}" font-size="10" font-weight="700" letter-spacing=".25">UPDATED</text>
	<text x="489" y="84" text-anchor="end" fill="{{strongTextColor}}" font-size="11" font-weight="700">{{updated}}</text>
	<line x1="501" y1="74" x2="501" y2="86" stroke="{{borderColor}}" stroke-width="1"/>
	<text x="508" y="84" fill="{{mutedTextColor}}" font-size="10" font-weight="700" letter-spacing=".25">COST</text>
	<text x="590" y="84" text-anchor="end" fill="{{strongTextColor}}" font-size="{{usageFontSize}}" font-weight="700">{{usage}}</text>
	<line x1="600" y1="0" x2="600" y2="100" stroke="{{statusBorderColor}}" stroke-width="1.5"/>
	<text x="620" y="18" fill="{{mutedTextColor}}" font-size="10" font-weight="700" letter-spacing=".4">STATUS</text>
	<text x="782" y="18" text-anchor="end" fill="{{mutedTextColor}}" font-size="10" font-weight="700">{{phaseDuration}}</text>
	{{activity}}
	<text x="638" y="56" fill="{{statusColor}}" font-size="{{statusFontSize}}" font-weight="700">{{status}}</text>
	<text x="620" y="82" fill="{{strongTextColor}}" font-size="10">{{activityDetail}}</text>
</svg>
